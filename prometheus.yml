global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: "outbox-publisher"
    static_configs:
      - targets: ["host.docker.internal:8001"]
  - job_name: "cache-sync"
    static_configs:
      - targets: ["host.docker.internal:8002"]