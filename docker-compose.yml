services:
  postgres:
    image: postgres:16
    container_name: store-postgres
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: store-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: